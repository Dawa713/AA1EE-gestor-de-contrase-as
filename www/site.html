<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir/Editar Site - Gestor de Contraseñas</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3>
                            <i class="bi bi-plus-square"></i> Añadir Nuevo Site
                        </h3>
                        <a href="index.html" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Volver
                        </a>
                    </div>
                    <div class="card-body">
                        <form id="siteForm" novalidate>
                            <!-- Nombre del Site -->
                            <div class="mb-3">
                                <label for="siteName" class="form-label">Nombre del Site *</label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="siteName" 
                                    required
                                    minlength="3"
                                >
                                <div class="invalid-feedback">
                                    El nombre debe tener al menos 3 caracteres
                                </div>
                                <div class="valid-feedback">
                                    ✓ Correcto
                                </div>
                            </div>
                            
                            <!-- URL -->
                            <div class="mb-3">
                                <label for="siteUrl" class="form-label">URL</label>
                                <input 
                                    type="url" 
                                    class="form-control" 
                                    id="siteUrl" 
                                    placeholder="https://ejemplo.com"
                                >
                                <div class="invalid-feedback">
                                    Por favor, introduce una URL válida
                                </div>
                                <div class="valid-feedback">
                                    ✓ Correcto
                                </div>
                            </div>
                            
                            <!-- Usuario -->
                            <div class="mb-3">
                                <label for="siteUser" class="form-label">Usuario *</label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="siteUser" 
                                    required
                                    minlength="3"
                                >
                                <div class="invalid-feedback">
                                    El usuario debe tener al menos 3 caracteres
                                </div>
                                <div class="valid-feedback">
                                    ✓ Correcto
                                </div>
                            </div>
                            
                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="sitePassword" class="form-label">Contraseña *</label>
                                <div class="input-group">
                                    <input 
                                        type="password" 
                                        class="form-control" 
                                        id="sitePassword" 
                                        required
                                        minlength="8"
                                    >
                                    <button 
                                        class="btn btn-outline-secondary" 
                                        type="button" 
                                        id="togglePassword"
                                        title="Mostrar/Ocultar contraseña"
                                    >
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    <button 
                                        class="btn btn-outline-primary" 
                                        type="button" 
                                        id="generatePassword"
                                        title="Generar contraseña segura"
                                    >
                                        <i class="bi bi-key"></i> Generar
                                    </button>
                                </div>
                                <div class="invalid-feedback">
                                    La contraseña debe tener al menos 8 caracteres
                                </div>
                                <div class="valid-feedback">
                                    ✓ Correcto
                                </div>
                                <small class="text-muted">Mínimo 8 caracteres</small>
                            </div>
                            
                            <!-- Descripción -->
                            <div class="mb-3">
                                <label for="siteDescription" class="form-label">Descripción</label>
                                <textarea 
                                    class="form-control" 
                                    id="siteDescription" 
                                    rows="3"
                                    maxlength="200"
                                ></textarea>
                                <small class="text-muted">Máximo 200 caracteres</small>
                            </div>
                            
                            <!-- Botones -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-save"></i> Guardar Site
                                </button>
                                <a href="index.html" class="btn btn-secondary">
                                    Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/api.js"></script>
    <script src="js/site.js"></script>
</body>
</html>
