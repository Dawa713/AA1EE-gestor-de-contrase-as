<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Contraseñas</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar - Lista de Categorías -->
            <div class="col-md-3 bg-light vh-100 p-3 sidebar">
                <h3 class="mb-4">
                    <i class="bi bi-shield-lock"></i> Gestor de Contraseñas
                </h3>
                
                <!-- Botón Añadir Categoría -->
                <button class="btn btn-primary w-100 mb-3" id="btnAddCategory">
                    <i class="bi bi-plus-circle"></i> Nueva Categoría
                </button>
                
                <!-- Lista de Categorías -->
                <div id="categoriesList" class="list-group">
                    <!-- Las categorías se cargarán dinámicamente aquí -->
                </div>
            </div>
            
            <!-- Main Content - Sites -->
            <div class="col-md-9 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 id="categoryTitle">Selecciona una categoría</h2>
                    <button class="btn btn-success" id="btnAddSite" style="display: none;">
                        <i class="bi bi-plus-lg"></i> Nuevo Site
                    </button>
                </div>
                
                <!-- Lista de Sites -->
                <div id="sitesList" class="row">
                    <!-- Los sites se cargarán dinámicamente aquí -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal para Añadir Categoría -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nueva Categoría</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">Nombre de la categoría *</label>
                            <input type="text" class="form-control" id="categoryName" required>
                            <div class="invalid-feedback">
                                El nombre de la categoría es obligatorio
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSaveCategory">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
